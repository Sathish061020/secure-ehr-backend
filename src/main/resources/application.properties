# ============================================================
# Secure EHR Backend - Production
# ============================================================

# Server
server.port=${PORT:8080}

# ============================================================
# DATABASE
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ============================================================
# JWT
# ============================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiry-ms=900000
app.jwt.refresh-token-expiry-ms=604800000

# ============================================================
# AES-256 ENCRYPTION
# ============================================================
app.encryption.secret-key=${ENCRYPTION_SECRET_KEY}

# ============================================================
# GMAIL / OTP
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# ============================================================
# OTP
# ============================================================
app.otp.expiry-minutes=5

# ============================================================
# CORS
# ============================================================
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:https://ehr-d3c3b.web.app}

# ============================================================
# RATE LIMITING
# ============================================================
app.rate-limit.max-login-attempts=5
app.rate-limit.lock-duration-minutes=15

# ============================================================
# LOGGING
# ============================================================
logging.level.com.ehr=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

server.error.include-message=always
server.error.include-stacktrace=never

# ============================================================
# ADMIN
# ============================================================
app.admin.email=${ADMIN_EMAIL:admin@ehr.com}
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:Admin@123}
app.admin.allowed-emails=${ADMIN_ALLOWED_EMAILS:admin@ehr.com}